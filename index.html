<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shop products from verified sellers across Rwanda. Pay with MTN MoMo or Airtel Money; Ikiguzi holds your payment until delivery." />
    <meta name="theme-color" content="#25addb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ikiguzi Marketplace · Shop from trusted sellers in Rwanda</title>
    <!-- Launch splash (mirrors Mvec_Mobile/lib/widgets/splash_gate.dart). Everything it needs is inline so
         it paints on the first frame, before any script loads. src/lib/splash.js fades it out. -->
    <link rel="preload" href="/fonts/KaushanScript-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      /* Apply the saved theme before first paint (ThemeProvider writes the same value later),
         and skip the splash when this tab session has already seen it. */
      try {
        var t = localStorage.getItem('mvec_theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        if (sessionStorage.getItem('mvec_splash_seen')) document.documentElement.classList.add('no-splash');
      } catch (e) {}
    </script>
    <style>
      @font-face { font-family: 'Kaushan Script'; src: url('/fonts/KaushanScript-Regular.ttf') format('truetype'); font-weight: 400; font-display: block; }
      #mvec-splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden;
        background: #f6f8f9; --sp-accent: #064f65; --sp-accent-text: rgba(6, 79, 101, .6); --sp-ink: rgba(107, 123, 132, .22); --sp-glow: rgba(6, 79, 101, .28); --sp-glow-y: 18px; --sp-glow-blur: 40px;
        font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; transition: opacity .45s ease-out; }
      [data-theme="dark"] #mvec-splash { background: #0a1418; --sp-accent: #0e7a97; --sp-accent-text: rgba(14, 122, 151, .85); --sp-ink: rgba(167, 186, 195, .17); --sp-glow: rgba(14, 122, 151, .4); --sp-glow-y: 8px; --sp-glow-blur: 36px; }
      #mvec-splash.is-fading { opacity: 0; pointer-events: none; }
      .no-splash #mvec-splash { display: none; }
      .mvec-splash-wall { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--sp-ink); pointer-events: none; }
      .mvec-splash-body { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px; text-align: center;
        animation: mvec-splash-in .9s cubic-bezier(.215, .61, .355, 1) both; }
      .mvec-splash-tile { width: 120px; height: 120px; border-radius: 34px; background: var(--sp-accent); box-shadow: 0 var(--sp-glow-y) var(--sp-glow-blur) var(--sp-glow); }
      .mvec-splash-tile svg { display: block; width: 100%; height: 100%; }
      .mvec-splash-word { margin-top: 36px; font-family: 'Kaushan Script', cursive; font-size: 48.3px; line-height: 1.1; color: var(--sp-accent); white-space: nowrap; }
      .mvec-splash-tag { margin-top: 6px; font-size: 13px; line-height: 1.45; letter-spacing: 2px; font-weight: 400; color: var(--sp-accent-text); }
      @keyframes mvec-splash-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #mvec-splash { transition-duration: .15s; }
        .mvec-splash-body { animation: none; }
      }
    </style>
    <noscript><style>#mvec-splash { display: none; }</style></noscript>
  </head>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* While the splash is up the app underneath is not reachable by keyboard or screen reader, as the
         mobile splash blocks touches. src/lib/splash.js lifts this; the timer is only a safety net for a
         bundle that fails to load, so the splash can never stay up for good. */
      (function () {
        var splash = document.getElementById('mvec-splash');
        var root = document.getElementById('root');
        if (!splash || document.documentElement.classList.contains('no-splash')) return;
        root.inert = true;
        setTimeout(function () {
          if (!document.body.contains(splash)) return;
          splash.classList.add('is-fading');
          root.inert = false;
          setTimeout(function () { splash.remove(); }, 600);
        }, 15000);
      })();
    </script>
